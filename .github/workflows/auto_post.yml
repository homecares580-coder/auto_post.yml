name: Islamic Auto Facebook Bot - Magura

on:
  schedule:
    # বাংলাদেশ সময় অনুযায়ী: ভোর ৩টা, সকাল ৮টা, দুপুর ২টা, সন্ধ্যা ৬টা, রাত ৭টা এবং রাত ১২টা
    - cron: '0 21,2,8,12,13,18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        run: |
          python bot.py
